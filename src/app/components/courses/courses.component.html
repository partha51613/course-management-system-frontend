<div class="container">

  <div class="title">
    <h2>COURSES</h2>
  </div>
  <div class="row mb-2">
    <div class="col-3"></div>
    <div class="col-3"></div>
    <div class="col-3"></div>
    <div class="col-3"><button type="submit" class="btn btn-success" (click)="getCourses()">GET COURSES</button></div>
  </div>
  <table class="table table-dark table-bordered">
    <thead>
      <tr>
        <th scope="col">S. No.</th>
        <th scope="col">Course Name</th>
        <th scope="col">SME</th>
      </tr>
    </thead>
    <tbody>
      @for (course of courseData; track $index) {
        <tr>
          
          <td>{{$index+1}}</td>
          <td>{{course.course_name}}</td>
          <td>{{course.sme_name}}</td>
      </tr>
      }
    </tbody>
  </table>
</div>
